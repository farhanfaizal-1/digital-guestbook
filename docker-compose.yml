
services:
  backend:
    build: ./backend
    container_name: guestbook-backend
    restart: unless-stopped
    volumes:
      - guestbook-db-data:/data
    networks:
      - app-net

  frontend:
    build: ./frontend
    container_name: guestbook-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - app-net

volumes:
  guestbook-db-data:

networks:
  app-net:
    driver: bridge
