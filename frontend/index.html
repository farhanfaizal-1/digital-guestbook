
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Guestbook - Buku Tamu Kampus</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
            padding: 30px 16px;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #1d4ed8;
            margin-bottom: 8px;
        }

        header p {
            color: #64748b;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        h2 {
            margin-bottom: 18px;
            font-size: 20px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-btn {
            width: 100%;
            margin-top: 20px;
            background: #2563eb;
            color: white;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .visitor {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .visitor h3 {
            margin-bottom: 7px;
        }

        .visitor p {
            color: #64748b;
            margin-bottom: 5px;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
            margin-top: 10px;
        }

        #status {
            margin-top: 12px;
            font-size: 14px;
        }

        .empty {
            color: #64748b;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Digital Guestbook</h1>
        <p>Buku Tamu Digital Kampus</p>
        <p>Silakan isi data kunjungan Anda.</p>
    </header>

    <section class="card">
        <h2>Formulir Pengunjung</h2>

        <form id="guestForm">

            <label for="name">Nama Lengkap</label>
            <input type="text" id="name" required>

            <label for="institution">Asal / Instansi</label>
            <input type="text" id="institution" required>

            <label for="purpose">Keperluan Kunjungan</label>
            <textarea id="purpose" required></textarea>

            <button type="submit" class="submit-btn">
                Simpan Data Pengunjung
            </button>

            <p id="status"></p>

        </form>
    </section>

    <section class="card">
        <h2>Daftar Pengunjung</h2>
        <div id="visitorList">
            <p class="empty">Memuat data...</p>
        </div>
    </section>

</div>

<script>
    // Alamat API backend.
    // Akan disesuaikan ketika Docker Compose dibuat.
    const API_URL = "/api/messages";

    const form = document.getElementById("guestForm");
    const statusText = document.getElementById("status");
    const visitorList = document.getElementById("visitorList");

    // Mengambil daftar pengunjung.
    async function loadVisitors() {
        try {
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Gagal mengambil data pengunjung");
            }

            const result = await response.json();
            const visitors = result.messages;

            visitorList.innerHTML = "";

            if (visitors.length === 0) {
                visitorList.innerHTML =
                    '<p class="empty">Belum ada pengunjung terdaftar.</p>';
                return;
            }

            visitors.forEach((visitor, index) => {
                const item = document.createElement("div");
                item.className = "visitor";

                const title = document.createElement("h3");
                title.textContent = visitor.name;

                const institution = document.createElement("p");
                institution.textContent = "Instansi: " + visitor.institution;

                const purpose = document.createElement("p");
                purpose.textContent = "Keperluan: " + visitor.purpose;

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Hapus";
                deleteButton.addEventListener("click", () => deleteVisitor(index));

                item.append(title, institution, purpose, deleteButton);
                visitorList.appendChild(item);
            });

        } catch (error) {
            visitorList.innerHTML =
                '<p class="empty">Backend belum dapat dihubungi.</p>';
            console.error(error);
        }
    }

    // Menambahkan data pengunjung.
    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const data = {
            name: document.getElementById("name").value.trim(),
            institution: document.getElementById("institution").value.trim(),
            purpose: document.getElementById("purpose").value.trim()
        };

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Gagal menyimpan data");
            }

            statusText.textContent = "Data pengunjung berhasil disimpan!";
            statusText.style.color = "green";

            form.reset();
            await loadVisitors();

        } catch (error) {
            statusText.textContent = error.message;
            statusText.style.color = "red";
        }
    });

    // Menghapus data pengunjung.
    async function deleteVisitor(index) {
        if (!confirm("Apakah Anda yakin ingin menghapus data ini?")) {
            return;
        }

        try {
            const response = await fetch(
                `${API_URL}?index=${index}`,
                { method: "DELETE" }
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Gagal menghapus data");
            }

            await loadVisitors();

        } catch (error) {
            alert(error.message);
        }
    }

    // Menampilkan data ketika halaman dibuka.
    loadVisitors();
</script>

</body>
</html>
